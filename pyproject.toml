[project]
name = "indexer"
version = "0.1.0"
description = "Securely fetch RSS/Atom feeds and record health checks in Postgres"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mh5" }]
requires-python = ">=3.13"
dependencies = [
    "aiohappyeyeballs>=2.7.1",
    "aiohttp>=3.14.5",
    "defusedxml>=0.7.1",
    "fasttext-predict>=0.9.2.4",
    "jinja2>=3.1.6",
    "numpy>=2.5.5",
    "onnxruntime>=1.32.0",
    "psycopg[binary]>=3.3.9",
    "publicsuffixlist>=1.1.2.20261115",
    "pyyaml>=6.0.3",
    "tokenizers>=0.23.3",
    "yarl>=1.25.1",
]

[project.scripts]
indexer = "indexer.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
    "types-defusedxml>=0.7.0.20260504",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "BLE"]

[tool.ruff.lint.flake8-bugbear]
# db.models.generated() returns a dataclasses.field, which is what a dataclass default may call.
extend-immutable-calls = ["indexer.db.models.generated"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::aiohttp.web_exceptions.NotAppKeyWarning"]

[tool.uv.build-backend]
# Liquibase's changelog and Dockerfile live in the db package but are not Python: keep them out
# of the wheel (the app image never needs them; compose builds and mounts them on their own).
wheel-exclude = ["indexer/db/liquibase"]
