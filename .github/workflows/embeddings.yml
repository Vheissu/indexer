# Rebuilds the embedding sets in data/embeddings/ (<name>.npy and <name>.json; see
# src/indexer/embeddings.py) whenever their sources or the image's MiniLM change, and commits them
# to the same branch. Loading refuses a stale set, so a change to a source (data/topics/topics.txt
# for the set "topics") is followed by this run within minutes. Embeds repository files only: no
# database, no network inside the container, nothing untrusted.
#
# A push made with the workflow's token starts no other workflow, so this never triggers itself.
name: embeddings

on:
  push:
    branches: [develop]
    paths:
      - data/topics/topics.txt # the set "topics"
      - Dockerfile # the MiniLM model and tokenizer are pinned there
  workflow_dispatch:

permissions:
  contents: write # to push the rebuilt matrix

concurrency:
  group: embeddings-${{ github.ref }}
  cancel-in-progress: true # a newer push rebuilds from newer names

jobs:
  embeddings:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker compose build embeddings

      - name: Build the embedding sets
        run: HOST_UID="$(id -u)" HOST_GID="$(id -g)" docker compose run --rm --no-deps -T embeddings

      - name: Commit the sets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- data/embeddings)" ]; then
            echo "The embedding sets are up to date."
            exit 0
          fi
          git add data/embeddings
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Rebuild the embedding sets in data/embeddings"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
